<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offline Timestamp Player</title>

<style>
body {
  margin:0;
  padding:10px;
  background:#000;
  color:#fff;
  font-family:Arial;
}

input, textarea, button {
  width:100%;
  margin:5px 0;
  padding:8px;
  background:#000;
  color:#fff;
  border:1px solid #333;
}

#videoBox {
  position:relative;
}

#video {
  width:100%;
}

/* CENTER CONTROLS */
#centerControls {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  align-items:center;
  z-index:10;
}

/* 🔥 custom spacing */
.group { display:flex; gap:10px; }
.group.center { gap:2cm; } /* ONLY here */

.hidden { display:none !important; }

.ctrlBtn {
  width:52px;
  height:52px;
  border-radius:50%;
  background:rgba(0,0,0,0.6);
  color:#00e5ff;
  border:1px solid rgba(0,229,255,0.6);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  box-shadow:0 0 8px rgba(0,229,255,0.4);
  cursor:pointer;
}

/* toggle */
#toggleBtn {
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
}

/* exit */
#exitFS {
  position:absolute;
  top:10px;
  right:10px;
}

/* TIMESTAMP BUTTONS */
#buttons {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}

.rangeBtn {
  padding:8px;
  border:1px solid #444;
  background:#0a0a0a;
  color:#ddd;
}

.rangeBtn.active {
  background:#00e5ff;
  color:#000;
  border:2px solid #fff;
  box-shadow:0 0 12px #00e5ff;
}
</style>
</head>

<body>

<input type="file" id="fileInput">
<textarea id="ranges"></textarea>
<button onclick="loadVideo()">Load</button>

<div id="videoBox">
  <video id="video" controls></video>

  <div id="centerControls">
    
    <div class="group">
      <div class="ctrlBtn" onclick="seek(-60)">-60</div>
      <div class="ctrlBtn" onclick="seek(-45)">-45</div>
      <div class="ctrlBtn" onclick="seek(-30)">-30</div>
      <div class="ctrlBtn" onclick="seek(-15)">-15</div>
    </div>

    <div class="group center">
      <div class="ctrlBtn" onclick="prevSegment()">⏮</div>
      <div class="ctrlBtn" onclick="nextSegment()">⏭</div>
    </div>

    <div class="group">
      <div class="ctrlBtn" onclick="seek(15)">+15</div>
      <div class="ctrlBtn" onclick="seek(30)">+30</div>
      <div class="ctrlBtn" onclick="seek(45)">+45</div>
      <div class="ctrlBtn" onclick="seek(60)">+60</div>
    </div>

  </div>

  <div id="toggleBtn" onclick="toggleControls()">≡</div>
  <div id="exitFS" onclick="exitFS()">⤫</div>
</div>

<div id="buttons"></div>

<script>
let video=document.getElementById("video");
let segments=[], index=-1;

/* parse */
function loadVideo(){
  let file=document.getElementById("fileInput").files[0];
  if(!file) return;

  video.src=URL.createObjectURL(file);

  segments=[];
  let lines=document.getElementById("ranges").value.split("\n");
  lines.forEach(l=>{
    if(!l.includes("-")) return;
    let p=l.split("-");
    segments.push([toSec(p[0]),toSec(p[1]),l]);
  });

  makeButtons();
}

/* time */
function toSec(t){
  let p=t.trim().split(":").map(Number);
  return p[0]*3600+p[1]*60+p[2];
}

/* buttons */
function makeButtons(){
  let box=document.getElementById("buttons");
  box.innerHTML="";
  segments.forEach((s,i)=>{
    let b=document.createElement("button");
    b.className="rangeBtn";
    b.textContent=s[2];
    b.onclick=()=>playFrom(i);
    box.appendChild(b);
  });
}

/* highlight */
function highlight(i){
  document.querySelectorAll(".rangeBtn")
    .forEach(b=>b.classList.remove("active"));

  let btn=document.querySelectorAll(".rangeBtn")[i];
  if(btn) btn.classList.add("active");
}

/* play */
function playFrom(i){
  index=i;
  video.currentTime=segments[i][0];
  video.play();
  highlight(i);
}

/* 🔥 SYNC HIGHLIGHT */
video.addEventListener("timeupdate",()=>{
  if(index<0) return;

  if(video.currentTime>=segments[index][1]){
    index++;
    if(index<segments.length){
      video.currentTime=segments[index][0];
      video.play();
      highlight(index);
    }
  }
});

/* controls */
function seek(s){ video.currentTime+=s; }
function prevSegment(){ if(index>0) playFrom(index-1); }
function nextSegment(){ if(index<segments.length-1) playFrom(index+1); }

function toggleControls(){
  document.getElementById("centerControls")
    .classList.toggle("hidden");
}

function exitFS(){ document.exitFullscreen(); }
</script>

</body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offline Timestamp Player</title>

<style>
body {
  margin:0;
  padding:10px;
  background:#000;
  color:#fff;
  font-family:Arial;
}

input, textarea, button {
  width:100%;
  margin:5px 0;
  padding:8px;
  background:#000;
  color:#fff;
  border:1px solid #333;
}

#videoBox {
  position:relative;
}

#video {
  width:100%;
}

/* CENTER CONTROLS */
#centerControls {
  position:absolute;
  top:60%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:8px;
  z-index:10;
}

.hidden { display:none !important; }

.ctrlBtn {
  width:48px;
  height:48px;
  border-radius:50%;
  background:rgba(0,0,0,0.6);
  color:#00e5ff;
  border:1px solid #00e5ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
}

/* 🔥 FIXED TOGGLE BUTTON */
#toggleBtn {
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  width:36px;
  height:36px;
  border-radius:50%;
  background:rgba(0,0,0,0.7);
  color:#00e5ff;
  border:1px solid #00e5ff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  z-index:20;
}

/* GRID */
#buttons {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
  gap:6px;
}

.rangeBtn.active {
  background:#00e5ff;
  color:#000;
}
</style>
</head>

<body>

<input type="file" id="fileInput" accept="video/*">
<textarea id="ranges"></textarea>
<button onclick="loadVideo()">Load</button>

<div id="videoBox">
  <video id="video" controls></video>

  <div id="centerControls">
    <div class="ctrlBtn" onclick="seek(-45)">-45</div>
    <div class="ctrlBtn" onclick="seek(-30)">-30</div>
    <div class="ctrlBtn" onclick="seek(-15)">-15</div>

    <div class="ctrlBtn" onclick="prevSegment()">⏮</div>
    <div class="ctrlBtn" onclick="nextSegment()">⏭</div>

    <div class="ctrlBtn" onclick="seek(15)">+15</div>
    <div class="ctrlBtn" onclick="seek(30)">+30</div>
    <div class="ctrlBtn" onclick="seek(45)">+45</div>
  </div>

  <div id="toggleBtn" onclick="toggleControls()">≡</div>
</div>

<div id="buttons"></div>

<script>
let video=document.getElementById("video");
let controls=document.getElementById("centerControls");
let videoBox=document.getElementById("videoBox");

let segments=[], index=-1, fileName="";
let timeout, manualHidden=false;

/* LOAD */
function loadVideo(){
  let file=document.getElementById("fileInput").files[0];
  if(!file) return;

  fileName=file.name;
  video.src=URL.createObjectURL(file);

  video.onloadedmetadata=()=>{
    video.playbackRate=2;

    restore();

    /* 🔥 FIX PLAY ISSUE */
    setTimeout(()=>{
      video.play().catch(()=>{});
    },200);

    /* 🔥 FULLSCREEN (CONTAINER) */
    if(videoBox.requestFullscreen){
      videoBox.requestFullscreen().catch(()=>{});
    }

    /* 🔥 LANDSCAPE (if supported) */
    if(screen.orientation && screen.orientation.lock){
      screen.orientation.lock("landscape").catch(()=>{});
    }
  };

  parseSegments();
}

/* SEGMENTS */
function parseSegments(){
  segments=[];
  let lines=document.getElementById("ranges").value.split("\n");
  lines.forEach(l=>{
    if(!l.includes("-")) return;
    let p=l.split("-");
    segments.push([toSec(p[0]),toSec(p[1])]);
  });
}

function toSec(t){
  let p=t.trim().split(":").map(Number);
  return p[0]*3600+p[1]*60+p[2];
}

function playFrom(i){
  index=i;
  playCurrent();
}

function playCurrent(){
  if(index<0||index>=segments.length) return;
  video.currentTime=segments[index][0];
  video.play();
}

video.addEventListener("timeupdate",()=>{
  save();

  if(index>=0 && video.currentTime>=segments[index][1]){
    index++;
    if(index<segments.length) playCurrent();
  }
});

/* SEEK */
function seek(s){
  video.currentTime=Math.max(0,video.currentTime+s);
}

/* NAV */
function prevSegment(){
  if(index>0){ index--; playCurrent(); }
}

function nextSegment(){
  if(index<segments.length-1){ index++; playCurrent(); }
}

/* CONTROLS */
function toggleControls(){
  manualHidden=!manualHidden;
  controls.classList.toggle("hidden",manualHidden);
}

video.addEventListener("click",()=>{
  if(!manualHidden){
    controls.classList.remove("hidden");
    clearTimeout(timeout);
    timeout=setTimeout(()=>controls.classList.add("hidden"),2000);
  }
});

/* RESUME */
function save(){
  localStorage.setItem("state",JSON.stringify({
    n:fileName,
    t:video.currentTime,
    i:index,
    r:document.getElementById("ranges").value
  }));
}

function restore(){
  let d=JSON.parse(localStorage.getItem("state")||"null");
  if(!d||d.n!==fileName) return;

  index=d.i;
  video.currentTime=d.t;
  document.getElementById("ranges").value=d.r;
}
</script>

</body>
      </html>

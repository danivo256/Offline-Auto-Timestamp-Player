<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offline Timestamp Player</title>

<style>
body {
  margin:0;
  padding:12px;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
}

h3 { color:#00e5ff; margin-top:16px; }

input, textarea, button {
  width:100%;
  margin:6px 0;
  padding:8px;
  background:#000;
  color:#fff;
  border:1px solid #333;
}

textarea { min-height:110px; }

#videoBoxElement {
  position:relative;
  margin-top:10px;
}

#videoElement {
  width:100%;
  background:#000;
}

/* CONTROLS */
#centerControlsElement {
  position:absolute;
  top:60%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:14px;
  z-index:10;
}

/* hidden state */
.hidden {
  display:none !important;
}

.controlButton {
  background:rgba(0,0,0,0.5);
  color:#00e5ff;
  border:1px solid rgba(0,229,255,0.6);
  border-radius:50%;
  width:56px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  backdrop-filter: blur(6px);
  cursor:pointer;
  transition:all 0.2s ease;
}

.controlButton:hover {
  background:#00e5ff;
  color:#000;
  box-shadow:0 0 16px #00e5ff;
  transform:scale(1.1);
}

/* HIDE BUTTON */
#hideControlsButton {
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.6);
  color:#00e5ff;
  border:1px solid #00e5ff;
  border-radius:50%;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  cursor:pointer;
  z-index:20;
}

/* GRID */
#buttonsContainer {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:8px;
  margin-top:12px;
}

.rangeButton {
  background:#0a0a0a;
  color:#ddd;
  border:1px solid #444;
  border-radius:4px;
  padding:8px 6px;
  font-size:13px;
  text-align:center;
  white-space:nowrap;
  cursor:pointer;
}

.rangeButton.active {
  background:#00e5ff;
  color:#000;
  font-weight:bold;
  border:2px solid #fff;
  box-shadow:0 0 12px #00e5ff;
}

.historyItemDiv {
  margin-top:6px;
  padding:8px;
  border:1px solid #222;
  background:#050505;
  cursor:pointer;
}
</style>
</head>

<body>

<h3>Offline Timestamp Player</h3>

<input type="file" id="fileInputElement" accept="video/*">

<textarea id="timestampRangesTextarea" placeholder=
"00:00:00 - 00:05:00
00:06:00 - 00:10:00"></textarea>

<button onclick="loadVideoFile()">Load Video</button>

<div id="videoBoxElement">
  <video id="videoElement" controls></video>

  <div id="centerControlsElement">
    <div class="controlButton" onclick="seekVideoTime(-30)">-30</div>
    <div class="controlButton" onclick="seekVideoTime(-10)">-10</div>
    <div class="controlButton" onclick="playPreviousSegment()">⏮</div>
    <div class="controlButton" onclick="playNextSegment()">⏭</div>
    <div class="controlButton" onclick="seekVideoTime(10)">+10</div>
    <div class="controlButton" onclick="seekVideoTime(30)">+30</div>
  </div>

  <div id="hideControlsButton" onclick="hideCenterControls()">✖</div>
</div>

<div id="buttonsContainer"></div>

<h3>History</h3>
<div id="historyContainer"></div>

<script>
let videoElement = document.getElementById("videoElement");
let centerControlsElement = document.getElementById("centerControlsElement");
let videoBoxElement = document.getElementById("videoBoxElement");
let controlsTimeoutIdentifier;

let videoSegmentsArray = [];
let currentSegmentIndexNumber = -1;
let uploadedFileNameString = "";

/* CORE */
function convertTimeStringToSeconds(timeStringParameter){
  let timePartsArray = timeStringParameter.trim().split(":").map(Number);
  return timePartsArray[0] * 3600 + timePartsArray[1] * 60 + timePartsArray[2];
}

function clearAllButtonHighlights(){
  document.querySelectorAll(".rangeButton").forEach(buttonElement => buttonElement.classList.remove("active"));
}

function highlightActiveSegmentButton(buttonIndexNumber){
  clearAllButtonHighlights();
  let targetButtonElement = document.querySelectorAll(".rangeButton")[buttonIndexNumber];
  if(targetButtonElement) {
      targetButtonElement.classList.add("active");
  }
}

function loadVideoFile(){
  let selectedVideoFileObject = document.getElementById("fileInputElement").files[0];
  if(!selectedVideoFileObject){ 
      alert("Select a video file"); 
      return; 
  }

  uploadedFileNameString = selectedVideoFileObject.name;
  videoElement.src = URL.createObjectURL(selectedVideoFileObject);
  videoElement.playbackRate = 2;

  videoSegmentsArray = [];
  currentSegmentIndexNumber = -1;

  let timestampLinesArray = document.getElementById("timestampRangesTextarea").value.trim().split("\n");
  timestampLinesArray.forEach(currentLineString => {
    if(!currentLineString.includes("-")) return;
    let splitTimeLineArray = currentLineString.split("-");
    videoSegmentsArray.push([
        convertTimeStringToSeconds(splitTimeLineArray[0]),
        convertTimeStringToSeconds(splitTimeLineArray[1]),
        currentLineString.trim()
    ]);
  });

  createRangeButtonsInDOM();
  restoreLastVideoStateFromStorage();
  saveVideoHistoryToStorage();
}

function createRangeButtonsInDOM(){
  let buttonsContainerElement = document.getElementById("buttonsContainer");
  buttonsContainerElement.innerHTML = "";
  videoSegmentsArray.forEach((segmentDataArray, segmentIndexNumber) => {
    let newButtonElement = document.createElement("button");
    newButtonElement.className = "rangeButton";
    newButtonElement.textContent = segmentDataArray[2];
    newButtonElement.onclick = () => playVideoFromSpecificIndex(segmentIndexNumber);
    buttonsContainerElement.appendChild(newButtonElement);
  });
}

function playVideoFromSpecificIndex(segmentIndexNumber){
  currentSegmentIndexNumber = segmentIndexNumber;
  playCurrentVideoSegment();
}

function playCurrentVideoSegment(){
  if(currentSegmentIndexNumber < 0 || currentSegmentIndexNumber >= videoSegmentsArray.length) return;
  highlightActiveSegmentButton(currentSegmentIndexNumber);
  videoElement.currentTime = videoSegmentsArray[currentSegmentIndexNumber][0];
  videoElement.play();
}

videoElement.addEventListener("timeupdate", () => {
  saveVideoProgressToStorage();
  if(currentSegmentIndexNumber < 0 || currentSegmentIndexNumber >= videoSegmentsArray.length) return;

  if(videoElement.currentTime >= videoSegmentsArray[currentSegmentIndexNumber][1]){
    videoElement.pause();
    currentSegmentIndexNumber++;
    if(currentSegmentIndexNumber < videoSegmentsArray.length){
      setTimeout(playCurrentVideoSegment, 200);
    }
  }
});

/* SEEK */
function seekVideoTime(secondsToSeekNumber){
  videoElement.currentTime = Math.max(0, videoElement.currentTime + secondsToSeekNumber);
}

/* NAV */
function playPreviousSegment(){
  if(currentSegmentIndexNumber > 0){ 
      currentSegmentIndexNumber--; 
      playCurrentVideoSegment(); 
  }
}

function playNextSegment(){
  if(currentSegmentIndexNumber < videoSegmentsArray.length - 1){ 
      currentSegmentIndexNumber++; 
      playCurrentVideoSegment(); 
  }
}

/* 🔥 HIDE CONTROLS */
function hideCenterControls(){
  centerControlsElement.classList.add("hidden");
  clearTimeout(controlsTimeoutIdentifier);
}

function showCenterControlsTemporarily(){
  centerControlsElement.classList.remove("hidden");
  clearTimeout(controlsTimeoutIdentifier);
  
  controlsTimeoutIdentifier = setTimeout(() => {
    centerControlsElement.classList.add("hidden");
  }, 2000);
}

/* TAP TO SHOW TEMP */
videoElement.addEventListener("click", showCenterControlsTemporarily);

/* RESUME */
function saveVideoProgressToStorage(){
  if(!uploadedFileNameString) return;
  localStorage.setItem("offline_last_state", JSON.stringify({
    name: uploadedFileNameString,
    time: videoElement.currentTime,
    index: currentSegmentIndexNumber,
    ranges: document.getElementById("timestampRangesTextarea").value.trim()
  }));
}

function restoreLastVideoStateFromStorage(){
  let savedStateDataParsed = JSON.parse(localStorage.getItem("offline_last_state") || "null");
  if(!savedStateDataParsed) return;
  
  let savedFileNameString = savedStateDataParsed.name || savedStateDataParsed.fileNameSaved;
  if(savedFileNameString !== uploadedFileNameString) return;

  document.getElementById("timestampRangesTextarea").value = savedStateDataParsed.ranges || savedStateDataParsed.timestampRangesSaved;
  currentSegmentIndexNumber = savedStateDataParsed.index !== undefined ? savedStateDataParsed.index : savedStateDataParsed.segmentIndexSaved;
  highlightActiveSegmentButton(currentSegmentIndexNumber);
  videoElement.currentTime = savedStateDataParsed.time !== undefined ? savedStateDataParsed.time : savedStateDataParsed.currentTimeSaved;
}

/* HISTORY */
function saveVideoHistoryToStorage(){
  let currentTimestampRangesString = document.getElementById("timestampRangesTextarea").value.trim();
  if(!currentTimestampRangesString) return;

  let videoHistoryArray = JSON.parse(localStorage.getItem("offline_ts") || "[]");
  
  videoHistoryArray = videoHistoryArray.filter(historyEntryObject => {
      let entryNameString = historyEntryObject.name || historyEntryObject.fileNameSaved;
      let entryRangesString = historyEntryObject.ranges || historyEntryObject.timestampRangesSaved;
      return !(entryNameString === uploadedFileNameString && entryRangesString === currentTimestampRangesString);
  });
  
  videoHistoryArray.unshift({
      name: uploadedFileNameString, 
      ranges: currentTimestampRangesString
  });
  
  if(videoHistoryArray.length > 15) {
      videoHistoryArray.length = 15;
  }

  localStorage.setItem("offline_ts", JSON.stringify(videoHistoryArray));
  renderVideoHistoryToDOM();
}

function renderVideoHistoryToDOM(){
  let historyContainerElement = document.getElementById("historyContainer");
  historyContainerElement.innerHTML = "";
  let videoHistoryArray = JSON.parse(localStorage.getItem("offline_ts") || "[]");

  videoHistoryArray.forEach(historyEntryObject => {
    let displayFileNameString = historyEntryObject.name || historyEntryObject.fileNameSaved;
    let displayRangesString = historyEntryObject.ranges || historyEntryObject.timestampRangesSaved;

    if(displayFileNameString) {
        let historyItemDivElement = document.createElement("div");
        historyItemDivElement.className = "historyItemDiv";
        historyItemDivElement.innerHTML = "<b>" + displayFileNameString + "</b>";
        historyItemDivElement.onclick = () => {
          document.getElementById("timestampRangesTextarea").value = displayRangesString;
          alert("Select the same file again");
        };
        historyContainerElement.appendChild(historyItemDivElement);
    }
  });
}

/* FULLSCREEN FIX */
document.addEventListener("fullscreenchange", () => {
  let isVideoFullscreenBoolean = document.fullscreenElement === videoElement;

  if(isVideoFullscreenBoolean){
    document.body.appendChild(centerControlsElement);
    centerControlsElement.style.position = "fixed";
    centerControlsElement.style.top = "60%";
    centerControlsElement.style.left = "50%";
    centerControlsElement.style.transform = "translate(-50%,-50%)";
    centerControlsElement.style.zIndex = "9999";
  } else {
    videoBoxElement.appendChild(centerControlsElement);
    centerControlsElement.style.position = "absolute";
    centerControlsElement.style.top = "60%";
    centerControlsElement.style.left = "50%";
  }
});

renderVideoHistoryToDOM();
</script>

</body>
</html>

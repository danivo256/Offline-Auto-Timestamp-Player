<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offline Timestamp Player</title>

<style>
body {
  margin:0;
  padding:12px;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
}

h3 { color:#00e5ff; margin-top:16px; }

input, textarea, button {
  width:100%;
  margin:6px 0;
  padding:8px;
  background:#000;
  color:#fff;
  border:1px solid #333;
}

textarea { min-height:110px; }

#videoBoxElement {
  position:relative;
  margin-top:10px;
}

#videoElement {
  width:100%;
  background:#000;
}

/* CONTROLS */
#centerControlsElement {
  position:absolute;
  top:60%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:14px;
  z-index:10;
}

/* hidden state */
.hidden {
  display:none !important;
}

.ctrlBtn {
  background:rgba(0,0,0,0.5);
  color:#00e5ff;
  border:1px solid rgba(0,229,255,0.6);
  border-radius:50%;
  width:56px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  backdrop-filter: blur(6px);
  cursor:pointer;
  transition:all 0.2s ease;
}

.ctrlBtn:hover {
  background:#00e5ff;
  color:#000;
  box-shadow:0 0 16px #00e5ff;
  transform:scale(1.1);
}

/* HIDE BUTTON */
#hideButton {
  position:absolute;
  right:10px;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,0.6);
  color:#00e5ff;
  border:1px solid #00e5ff;
  border-radius:50%;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  cursor:pointer;
  z-index:20;
}

/* GRID */
#buttons {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:8px;
  margin-top:12px;
}

.rangeBtn {
  background:#0a0a0a;
  color:#ddd;
  border:1px solid #444;
  border-radius:4px;
  padding:8px 6px;
  font-size:13px;
  text-align:center;
  white-space:nowrap;
  cursor:pointer;
}

.rangeBtn.active {
  background:#00e5ff;
  color:#000;
  font-weight:bold;
  border:2px solid #fff;
  box-shadow:0 0 12px #00e5ff;
}

.historyItem {
  margin-top:6px;
  padding:8px;
  border:1px solid #222;
  background:#050505;
  cursor:pointer;
}
</style>
</head>

<body>

<h3>Offline Timestamp Player</h3>

<input type="file" id="fileInput" accept="video/*">

<textarea id="ranges" placeholder=
"00:00:00 - 00:05:00
00:06:00 - 00:10:00"></textarea>

<button onclick="loadVideoFile()">Load Video</button>

<div id="videoBoxElement">
  <video id="videoElement" controls></video>

  <div id="centerControlsElement">
    <div class="ctrlBtn" onclick="seekVideoTime(-30)">-30</div>
    <div class="ctrlBtn" onclick="seekVideoTime(-10)">-10</div>
    <div class="ctrlBtn" onclick="playPreviousSegment()">⏮</div>
    <div class="ctrlBtn" onclick="playNextSegment()">⏭</div>
    <div class="ctrlBtn" onclick="seekVideoTime(10)">+10</div>
    <div class="ctrlBtn" onclick="seekVideoTime(30)">+30</div>
  </div>

  <div id="hideButton" onclick="hideCenterControls()">✖</div>
</div>

<div id="buttons"></div>

<h3>History</h3>
<div id="history"></div>

<script>
let videoElement = document.getElementById("videoElement");
let centerControlsElement = document.getElementById("centerControlsElement");
let videoBoxElement = document.getElementById("videoBoxElement");

let videoSegmentsArray = [];
let currentSegmentIndex = -1;
let uploadedFileName = "";

/* CORE */
function convertTimeToSeconds(timeString){
  let timePartsArray = timeString.trim().split(":").map(Number);
  return timePartsArray[0] * 3600 + timePartsArray[1] * 60 + timePartsArray[2];
}

function clearButtonHighlights(){
  document.querySelectorAll(".rangeBtn").forEach(buttonElement => buttonElement.classList.remove("active"));
}

function highlightActiveButton(buttonIndex){
  clearButtonHighlights();
  let targetButtonElement = document.querySelectorAll(".rangeBtn")[buttonIndex];
  if(targetButtonElement) {
      targetButtonElement.classList.add("active");
  }
}

function loadVideoFile(){
  let selectedVideoFile = document.getElementById("fileInput").files[0];
  if(!selectedVideoFile){ 
      alert("Select a video file"); 
      return; 
  }

  uploadedFileName = selectedVideoFile.name;
  videoElement.src = URL.createObjectURL(selectedVideoFile);
  videoElement.playbackRate = 2;

  videoSegmentsArray = [];
  currentSegmentIndex = -1;

  let timestampLinesArray = document.getElementById("ranges").value.trim().split("\n");
  timestampLinesArray.forEach(currentLineString => {
    if(!currentLineString.includes("-")) return;
    let splitTimeLineArray = currentLineString.split("-");
    videoSegmentsArray.push([
        convertTimeToSeconds(splitTimeLineArray[0]),
        convertTimeToSeconds(splitTimeLineArray[1]),
        currentLineString.trim()
    ]);
  });

  createRangeButtons();
  restoreLastVideoState();
  saveVideoHistory();
}

function createRangeButtons(){
  let buttonsContainerElement = document.getElementById("buttons");
  buttonsContainerElement.innerHTML = "";
  videoSegmentsArray.forEach((segmentDataArray, segmentIndexNumber) => {
    let newButtonElement = document.createElement("button");
    newButtonElement.className = "rangeBtn";
    newButtonElement.textContent = segmentDataArray[2];
    newButtonElement.onclick = () => playVideoFromIndex(segmentIndexNumber);
    buttonsContainerElement.appendChild(newButtonElement);
  });
}

function playVideoFromIndex(segmentIndexNumber){
  currentSegmentIndex = segmentIndexNumber;
  playCurrentVideoSegment();
}

function playCurrentVideoSegment(){
  if(currentSegmentIndex < 0 || currentSegmentIndex >= videoSegmentsArray.length) return;
  highlightActiveButton(currentSegmentIndex);
  videoElement.currentTime = videoSegmentsArray[currentSegmentIndex][0];
  videoElement.play();
}

videoElement.addEventListener("timeupdate", () => {
  saveVideoProgress();
  if(currentSegmentIndex < 0 || currentSegmentIndex >= videoSegmentsArray.length) return;

  if(videoElement.currentTime >= videoSegmentsArray[currentSegmentIndex][1]){
    videoElement.pause();
    currentSegmentIndex++;
    if(currentSegmentIndex < videoSegmentsArray.length){
      setTimeout(playCurrentVideoSegment, 200);
    }
  }
});

/* SEEK */
function seekVideoTime(secondsToSeek){
  videoElement.currentTime = Math.max(0, videoElement.currentTime + secondsToSeek);
}

/* NAV */
function playPreviousSegment(){
  if(currentSegmentIndex > 0){ 
      currentSegmentIndex--; 
      playCurrentVideoSegment(); 
  }
}

function playNextSegment(){
  if(currentSegmentIndex < videoSegmentsArray.length - 1){ 
      currentSegmentIndex++; 
      playCurrentVideoSegment(); 
  }
}

/* 🔥 HIDE CONTROLS */
function hideCenterControls(){
  centerControlsElement.classList.add("hidden");
}

function showCenterControls(){
  centerControlsElement.classList.remove("hidden");
}

/* TAP TO SHOW */
videoElement.addEventListener("click", showCenterControls);

/* RESUME */
function saveVideoProgress(){
  if(!uploadedFileName) return;
  localStorage.setItem("offline_last_state", JSON.stringify({
    fileNameSaved: uploadedFileName,
    currentTimeSaved: videoElement.currentTime,
    segmentIndexSaved: currentSegmentIndex,
    timestampRangesSaved: document.getElementById("ranges").value.trim()
  }));
}

function restoreLastVideoState(){
  let savedStateData = JSON.parse(localStorage.getItem("offline_last_state") || "null");
  if(!savedStateData) return;
  if(savedStateData.fileNameSaved !== uploadedFileName) return;

  document.getElementById("ranges").value = savedStateData.timestampRangesSaved;
  currentSegmentIndex = savedStateData.segmentIndexSaved;
  highlightActiveButton(currentSegmentIndex);
  videoElement.currentTime = savedStateData.currentTimeSaved;
}

/* HISTORY */
function saveVideoHistory(){
  let currentTimestampRanges = document.getElementById("ranges").value.trim();
  if(!currentTimestampRanges) return;

  let videoHistoryArray = JSON.parse(localStorage.getItem("offline_ts") || "[]");
  videoHistoryArray = videoHistoryArray.filter(historyEntryObject => 
      !(historyEntryObject.fileNameSaved === uploadedFileName && historyEntryObject.timestampRangesSaved === currentTimestampRanges)
  );
  
  videoHistoryArray.unshift({
      fileNameSaved: uploadedFileName, 
      timestampRangesSaved: currentTimestampRanges
  });
  
  if(videoHistoryArray.length > 15) {
      videoHistoryArray.length = 15;
  }

  localStorage.setItem("offline_ts", JSON.stringify(videoHistoryArray));
  renderVideoHistory();
}

function renderVideoHistory(){
  let historyContainerElement = document.getElementById("history");
  historyContainerElement.innerHTML = "";
  let videoHistoryArray = JSON.parse(localStorage.getItem("offline_ts") || "[]");

  videoHistoryArray.forEach(historyEntryObject => {
    let historyItemDivElement = document.createElement("div");
    historyItemDivElement.className = "historyItem";
    historyItemDivElement.innerHTML = "<b>" + historyEntryObject.fileNameSaved + "</b>";
    historyItemDivElement.onclick = () => {
      document.getElementById("ranges").value = historyEntryObject.timestampRangesSaved;
      alert("Select the same file again");
    };
    historyContainerElement.appendChild(historyItemDivElement);
  });
}

/* FULLSCREEN FIX */
document.addEventListener("fullscreenchange", () => {
  let isVideoFullscreen = document.fullscreenElement === videoElement;

  if(isVideoFullscreen){
    document.body.appendChild(centerControlsElement);
    centerControlsElement.style.position = "fixed";
    centerControlsElement.style.top = "60%";
    centerControlsElement.style.left = "50%";
    centerControlsElement.style.transform = "translate(-50%,-50%)";
    centerControlsElement.style.zIndex = "9999";
  } else {
    videoBoxElement.appendChild(centerControlsElement);
    centerControlsElement.style.position = "absolute";
    centerControlsElement.style.top = "60%";
    centerControlsElement.style.left = "50%";
  }
});

renderVideoHistory();
</script>

</body>
</html>

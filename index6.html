<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offline Timestamp Player</title>

<style>
body {
  margin:0;
  padding:12px;
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
}

h3 { color:#00e5ff; margin-top:16px; }

input, textarea, button {
  width:100%;
  margin:6px 0;
  padding:8px;
  background:#000;
  color:#fff;
  border:1px solid #333;
}

textarea { min-height:110px; }

#videoBox {
  position:relative;
  margin-top:10px;
}

#video {
  width:100%;
  background:#000;
}

/* CONTROLS */
#centerControls {
  position:absolute;
  top:60%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  gap:14px;
  z-index:10;
  opacity:1;
  transition:opacity 0.25s;
}

.ctrlBtn {
  background:rgba(0,0,0,0.5);
  color:#00e5ff;
  border:1px solid rgba(0,229,255,0.6);
  border-radius:50%;
  width:56px;
  height:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  backdrop-filter: blur(6px);
  cursor:pointer;
  transition:all 0.2s ease;
}

.ctrlBtn:hover {
  background:#00e5ff;
  color:#000;
  box-shadow:0 0 16px #00e5ff;
  transform:scale(1.1);
}

/* GRID */
#buttons {
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
  gap:8px;
  margin-top:12px;
}

.rangeBtn {
  background:#0a0a0a;
  color:#ddd;
  border:1px solid #444;
  border-radius:4px;
  padding:8px 6px;
  font-size:13px;
  text-align:center;
  white-space:nowrap;
  cursor:pointer;
}

.rangeBtn.active {
  background:#00e5ff;
  color:#000;
  font-weight:bold;
  border:2px solid #fff;
  box-shadow:0 0 12px #00e5ff;
}

.historyItem {
  margin-top:6px;
  padding:8px;
  border:1px solid #222;
  background:#050505;
  cursor:pointer;
}
</style>
</head>

<body>

<h3>Offline Timestamp Player</h3>

<input type="file" id="fileInput" accept="video/*">

<textarea id="ranges" placeholder=
"00:00:00 - 00:05:00
00:06:00 - 00:10:00"></textarea>

<button onclick="loadVideo()">Load Video</button>

<div id="videoBox">
  <video id="video" controls></video>

  <div id="centerControls">
    <div class="ctrlBtn" onclick="seek(-30)">-30</div>
    <div class="ctrlBtn" onclick="seek(-10)">-10</div>
    <div class="ctrlBtn" onclick="prevSegment()">⏮</div>
    <div class="ctrlBtn" onclick="nextSegment()">⏭</div>
    <div class="ctrlBtn" onclick="seek(10)">+10</div>
    <div class="ctrlBtn" onclick="seek(30)">+30</div>
  </div>
</div>

<div id="buttons"></div>

<h3>History</h3>
<div id="history"></div>

<script>
let video = document.getElementById("video");
let controls = document.getElementById("centerControls");
let videoBox = document.getElementById("videoBox");

let segments = [];
let index = -1;
let fileName = "";
let timeout;

/* CORE */

function toSeconds(t){
  let p=t.trim().split(":").map(Number);
  return p[0]*3600+p[1]*60+p[2];
}

function clearHighlight(){
  document.querySelectorAll(".rangeBtn").forEach(b=>b.classList.remove("active"));
}

function highlight(i){
  clearHighlight();
  let b=document.querySelectorAll(".rangeBtn")[i];
  if(b) b.classList.add("active");
}

function loadVideo(){
  let file=document.getElementById("fileInput").files[0];
  if(!file){ alert("Select a video file"); return; }

  fileName=file.name;
  video.src=URL.createObjectURL(file);
  video.playbackRate=2;

  segments=[];
  index=-1;

  let lines=document.getElementById("ranges").value.trim().split("\n");
  lines.forEach(l=>{
    if(!l.includes("-")) return;
    let p=l.split("-");
    segments.push([toSeconds(p[0]),toSeconds(p[1]),l.trim()]);
  });

  makeButtons();
  restoreLastState();
  saveHistory();
}

function makeButtons(){
  let box=document.getElementById("buttons");
  box.innerHTML="";
  segments.forEach((s,i)=>{
    let b=document.createElement("button");
    b.className="rangeBtn";
    b.textContent=s[2];
    b.onclick=()=>playFrom(i);
    box.appendChild(b);
  });
}

function playFrom(i){
  index=i;
  playCurrent();
}

function playCurrent(){
  if(index<0||index>=segments.length) return;
  highlight(index);
  video.playbackRate=2;
  video.currentTime=segments[index][0];
  video.play();
}

/* AUTO CONTINUE */
video.addEventListener("timeupdate",()=>{
  saveProgress();
  if(index<0||index>=segments.length) return;

  if(video.currentTime>=segments[index][1]){
    video.pause();
    index++;
    if(index<segments.length){
      setTimeout(playCurrent,200);
    }
  }
});

/* SEEK */
function seek(sec){
  video.currentTime = Math.max(0, video.currentTime + sec);
}

/* NAV */
function prevSegment(){
  if(index>0){
    index--;
    playCurrent();
  }
}

function nextSegment(){
  if(index<segments.length-1){
    index++;
    playCurrent();
  }
}

/* RESUME */
function saveProgress(){
  if(!fileName) return;
  localStorage.setItem("offline_last_state",JSON.stringify({
    name:fileName,
    time:video.currentTime,
    index:index,
    ranges:document.getElementById("ranges").value.trim()
  }));
}

function restoreLastState(){
  let data=JSON.parse(localStorage.getItem("offline_last_state")||"null");
  if(!data) return;
  if(data.name!==fileName) return;

  document.getElementById("ranges").value=data.ranges;
  index=data.index;
  highlight(index);
  video.currentTime=data.time;
}

/* HISTORY */
function saveHistory(){
  let ranges=document.getElementById("ranges").value.trim();
  if(!ranges) return;

  let data=JSON.parse(localStorage.getItem("offline_ts")||"[]");
  data=data.filter(d=>!(d.name===fileName && d.ranges===ranges));
  data.unshift({name:fileName,ranges:ranges,time:Date.now()});
  if(data.length>15) data.length=15;

  localStorage.setItem("offline_ts",JSON.stringify(data));
  renderHistory();
}

function renderHistory(){
  let box=document.getElementById("history");
  box.innerHTML="";
  let data=JSON.parse(localStorage.getItem("offline_ts")||"[]");

  data.forEach(d=>{
    let div=document.createElement("div");
    div.className="historyItem";
    div.innerHTML="<b>"+d.name+"</b><br><small>Tap → then select same file again</small>";
    div.onclick=()=>{
      document.getElementById("ranges").value=d.ranges;
      alert("Now select the same video file again");
    };
    box.appendChild(div);
  });
}

/* AUTO HIDE */
video.addEventListener("click", ()=>{
  controls.style.opacity = "1";
  clearTimeout(timeout);
  timeout = setTimeout(()=>{
    controls.style.opacity = "0.15";
  }, 2000);
});

/* 🔥 FULLSCREEN FIX (IMPORTANT) */

document.addEventListener("fullscreenchange", handleFullscreen);
document.addEventListener("webkitfullscreenchange", handleFullscreen);

function handleFullscreen(){
  let isFull = document.fullscreenElement === video || 
               document.webkitFullscreenElement === video;

  if(isFull){
    controls.style.opacity = "1";

    document.body.appendChild(controls);

    controls.style.position = "fixed";
    controls.style.top = "60%";
    controls.style.left = "50%";
    controls.style.transform = "translate(-50%, -50%)";
    controls.style.zIndex = "9999";
  } else {
    videoBox.appendChild(controls);

    controls.style.position = "absolute";
    controls.style.top = "60%";
    controls.style.left = "50%";
    controls.style.transform = "translate(-50%, -50%)";
    controls.style.zIndex = "10";
  }
}

renderHistory();
</script>

</body>
</html>
